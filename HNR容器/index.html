<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNR官方网站</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "Microsoft YaHei", sans-serif;
}
body {
background-color: #6c5ce7;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 20px;
}
.main-box {
background-color: #fff;
width: 100%;
max-width: 700px;
border-radius: 16px;
overflow: hidden;
box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.top-bar {
background-color: #6c5ce7;
padding: 12px 20px;
display: flex;
align-items: center;
justify-content: space-between;
color: #fff;
font-size: 14px;
}
.top-bar .left {
display: flex;
align-items: center;
gap: 8px;
}
.top-bar .right {
display: flex;
align-items: center;
gap: 12px;
color: #eee;
font-size: 12px;
}
.card-content {
padding: 30px 25px;
text-align: center;
}
.app-icon {
width: 70px;
height: 70px;
background: linear-gradient(135deg, #a8e6cf, #dcedc1);
border-radius: 16px;
margin: 0 auto 12px;
display: flex;
align-items: center;
justify-content: center;
font-size: 24px;
color: #fff;
font-weight: bold;
}
.app-name {
font-size: 24px;
font-weight: bold;
color: #333;
margin-bottom: 6px;
}
.app-desc {
font-size: 13px;
color: #666;
margin-bottom: 20px;
line-height: 1.4;
}
.path-bar {
background-color: #f8f9fa;
border-radius: 8px;
padding: 10px 15px;
text-align: left;
font-size: 13px;
color: #6c5ce7;
margin-bottom: 25px;
}
.file-list {
width: 100%;
}
.file-item {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 10px;
border-bottom: 1px solid #eee;
}
.file-item:last-child {
border-bottom: none;
}
.file-left {
display: flex;
align-items: center;
gap: 10px;
}
.file-icon {
width: 24px;
height: 24px;
border-radius: 4px;
object-fit: cover;
background-color: #f5f5f5; /* 图片加载失败时的背景色 */
display: flex;
align-items: center;
justify-content: center;
color: #999;
font-size: 10px;
}
.file-name {
font-size: 14px;
color: #333;
}
.file-size {
font-size: 12px;
color: #999;
margin-left: 10px;
}
.download-btn {
background-color: #6c5ce7;
color: #fff;
border: none;
border-radius: 6px;
padding: 6px 14px;
font-size: 12px;
cursor: pointer;
transition: 0.2s;
}
.download-btn:hover {
background-color: #5a4dbf;
}
.download-btn:disabled {
background-color: #ccc;
cursor: not-allowed;
}
/* 下载提示弹窗 */
.toast {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
background-color: rgba(0,0,0,0.7);
color: #fff;
padding: 8px 16px;
border-radius: 4px;
font-size: 12px;
opacity: 0;
transition: opacity 0.3s;
pointer-events: none;
}
.toast.show {
opacity: 1;
}
</style>
</head>
<body>
<div class="main-box">
<!-- 顶部栏 -->
<div class="top-bar">
<div class="left">
<span>📂</span>
<span>HNR官方网站</span>
</div>
<div class="right">
<span>↻</span>
<span>◀</span>
<span>▶</span>
<span>🏠</span>
<span>☰</span>
</div>
</div>

<!-- 内容卡片 -->
<div class="card-content">
<div class="app-icon">HNR</div>
<div class="app-name">HNR</div>
<div class="app-desc">HNR官方正式版 稳定直装 官方下载</div>

<!-- 路径栏 -->
<div class="path-bar">
根目录 / HNR
</div>

<!-- 文件列表 -->
<div class="file-list">
<div class="file-item">
<div class="file-left">
<!-- 图片加载失败时显示"A"占位 -->
<img class="file-icon" src="/HNR容器/A.png" alt="图标1" onload="this.style.display='flex'" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
<span class="file-icon" style="display: none;">A</span>
<span class="file-name">HNR A版.apk</span>
<span class="file-size">此版本有追踪</span>
</div>
<button class="download-btn" onclick="downloadFile('/HNR容器/A.apk', 'HNR A版.apk')">下载</button>
</div>

<div class="file-item">
<div class="file-left">
<!-- 图片加载失败时显示"B"占位 -->
<img class="file-icon" src="/HNR容器/B.png" alt="图标2" onload="this.style.display='flex'" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
<span class="file-icon" style="display: none;">B</span>
<span class="file-name">HNR B版.apk</span>
<span class="file-size">此版本有秒刷新美化</span>
</div>
<button class="download-btn" onclick="downloadFile('/HNR容器/B.apk', 'HNR B版.apk')">下载</button>
</div>
</div>
</div>
</div>

<!-- 下载提示弹窗 -->
<div class="toast" id="downloadToast"></div>

<script>
const toast = document.getElementById('downloadToast');

// 触发文件下载的函数（添加文件名和状态提示）
function downloadFile(filePath, fileName) {
// 显示下载中提示
showToast(`正在下载 ${fileName}...`);

// 创建隐藏的a标签实现下载
const a = document.createElement('a');
a.href = filePath;
a.download = fileName; // 自定义下载文件名
a.style.display = 'none';
document.body.appendChild(a);

// 下载成功/失败监听
a.addEventListener('load', () => {
showToast(`${fileName} 下载成功！`);
document.body.removeChild(a);
});

a.addEventListener('error', () => {
showToast(`${fileName} 下载失败，请检查文件路径！`);
document.body.removeChild(a);
});

a.click();
}

// 显示提示弹窗
function showToast(message) {
toast.textContent = message;
toast.classList.add('show');
setTimeout(() => {
toast.classList.remove('show');
}, 2000);
}
</script>
</body>
</html>
